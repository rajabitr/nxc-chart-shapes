<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXC Chart Shapes - Signal Browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #131722;
      color: #d1d4dc;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1e222d;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #2a2e39;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, input {
      padding: 6px 10px;
      border: 1px solid #363a45;
      border-radius: 4px;
      background: #131722;
      color: #d1d4dc;
      font-size: 12px;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #2962ff;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #2962ff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1e53e4;
    }

    .btn-secondary {
      background: #363a45;
      color: #d1d4dc;
    }

    .btn-secondary:hover {
      background: #434651;
    }

    .btn-danger {
      background: #f44336;
      color: #fff;
    }

    .btn-danger:hover {
      background: #d32f2f;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .chart-container {
      flex: 1;
      height: calc(100vh - 170px);
    }

    .sidebar {
      width: 380px;
      height: calc(100vh - 170px);
      background: #1e222d;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .signal-count {
      font-size: 11px;
      color: #787b86;
      background: #363a45;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .signal-list {
      flex: 1;
      overflow-y: scroll;
      overflow-x: hidden;
      padding: 8px;
    }

    .signal-item {
      background: #131722;
      border: 1px solid #363a45;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .signal-item:hover {
      border-color: #2962ff;
      background: #1a1e2a;
    }

    .signal-item.active {
      border-color: #2962ff;
      background: #1a2744;
    }

    .signal-item.buy {
      border-left: 3px solid #4caf50;
    }

    .signal-item.sell {
      border-left: 3px solid #f44336;
    }

    .signal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .signal-row:last-child {
      margin-bottom: 0;
    }

    .signal-symbol {
      font-weight: 600;
      color: #fff;
      font-size: 12px;
    }

    .signal-type {
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 600;
      font-size: 10px;
    }

    .signal-type.buy {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }

    .signal-type.sell {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }

    .signal-info {
      color: #787b86;
    }

    .signal-info strong {
      color: #d1d4dc;
    }

    .strategy-badge {
      background: #363a45;
      color: #d1d4dc;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
    }

    .log-panel {
      background: #0d0f14;
      border-top: 1px solid #2a2e39;
      height: 120px;
      flex-shrink: 0;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 10px;
    }

    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #1e222d;
    }

    .log-entry.info { color: #2196f3; }
    .log-entry.success { color: #4caf50; }
    .log-entry.error { color: #f44336; }
    .log-entry.warn { color: #ff9800; }

    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #363a45;
      border-top-color: #2962ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .filter-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .filter-row label {
      font-size: 11px;
      color: #787b86;
    }
  </style>
</head>
<body>
  <div class="loading hidden" id="loading">
    <div class="spinner"></div>
  </div>

  <header class="header">
    <h1>Signal Browser</h1>
    <div class="controls">
      <div class="filter-row">
        <label>Symbol:</label>
        <input type="text" id="symbol" value="BTCUSDT" style="width: 100px;">
      </div>
      <div class="filter-row">
        <label>Exchange:</label>
        <select id="exchangeId">
          <option value="1">Futures</option>
          <option value="2">Spot</option>
        </select>
      </div>
      <div class="filter-row">
        <label>Timeframe:</label>
        <select id="timeframe" onchange="changeTimeframe(this.value)">
          <option value="5">5m</option>
          <option value="15">15m</option>
          <option value="30">30m</option>
          <option value="60">1h</option>
          <option value="240">4h</option>
          <option value="1440">1D</option>
        </select>
      </div>
      <div class="filter-row">
        <label>Count:</label>
        <input type="number" id="countback" value="100" style="width: 60px;">
      </div>
      <button class="btn-primary" onclick="fetchSignals()">Load Signals</button>
      <button class="btn-secondary" onclick="clearShapes()">Clear Shapes</button>
    </div>
  </header>

  <main class="main">
    <div class="chart-container" id="chartContainer"></div>
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Signals</h2>
        <span class="signal-count" id="signalCount">0</span>
      </div>
      <div class="signal-list" id="signalList">
        <p style="color: #787b86; font-size: 12px; text-align: center; padding: 20px;">
          Click "Load Signals" to fetch signals
        </p>
      </div>
    </aside>
  </main>

  <div class="log-panel" id="logPanel"></div>

  <!-- TradingView Charting Library -->
  <script src="../vendor/tradingview/charting_library/charting_library.standalone.js"></script>

  <!-- NXC Chart Shapes Library (cache bust: v5) -->
  <script src="../dist/umd/nxc-chart-shapes.js?v=19"></script>

  <script>
    // Configuration
    const API_BASE = 'https://apis.nexcrypto.trade/v1';
    const API_KEY = 'MOaNJZ3ZitI1ZSOEf0BATXH1Q0sxP5lnbReA_LZRFbE';
    const ACCESS_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjozNiwic2Vzc2lvbl9pZCI6MTExLCJlbWFpbCI6Im5leGNyeXB0b3RyYWRlQGdtYWlsLmNvbSIsInJvbGUiOiJ1c2VyIiwiaXNzIjoibmV4Y3J5cHRvLWFwaSIsInN1YiI6Im5leGNyeXB0b3RyYWRlQGdtYWlsLmNvbSIsImV4cCI6MTc3MDMwNDAwOCwibmJmIjoxNzcwMjg5NjA4LCJpYXQiOjE3NzAyODk2MDh9.meRaIhjB07sQKLSxqP1gpP_SWKUPPS18hViSFLuxNTU';

    // Global state
    let tvWidget = null;
    let shapesManager = null;
    let allSignals = [];
    let activeSignalId = null;
    let strategyNames = {}; // Map of strategy_id -> name

    // Get Binance API URL
    function getBinanceApiUrl(exchangeId) {
      return exchangeId === 2
        ? 'https://api.binance.com/api/v3/klines'
        : 'https://fapi.binance.com/fapi/v1/klines';
    }

    // Logging
    function log(message, type = 'info') {
      const logPanel = document.getElementById('logPanel');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
      console.log(`[${type}] ${message}`);
    }

    // Loading overlay
    function showLoading(show) {
      document.getElementById('loading').classList.toggle('hidden', !show);
    }

    // Format time
    function formatTime(unix) {
      return new Date(unix * 1000).toLocaleString('en-GB', {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Get strategy name from API data or fallback
    function getStrategyName(strategyId) {
      // First check API-fetched names
      if (strategyNames[strategyId]) {
        return strategyNames[strategyId];
      }
      return `Strategy ${strategyId}`;
    }

    // Fetch strategy names from API (in batches to avoid URL length issues)
    async function fetchStrategyNames(strategyIds) {
      if (!strategyIds || strategyIds.length === 0) return;

      const BATCH_SIZE = 50; // Fetch 50 at a time
      const batches = [];

      for (let i = 0; i < strategyIds.length; i += BATCH_SIZE) {
        batches.push(strategyIds.slice(i, i + BATCH_SIZE));
      }

      log(`Fetching ${strategyIds.length} strategies in ${batches.length} batch(es)...`, 'info');

      for (const batch of batches) {
        try {
          const idsParam = batch.join(',');
          const url = `${API_BASE}/strategies?ids=${idsParam}&limit=100`;

          const response = await fetch(url, {
            headers: {
              'Accept': 'application/json',
              'X-API-Key': API_KEY,
              'Authorization': `Bearer ${ACCESS_TOKEN}`
            }
          });

          if (!response.ok) {
            log(`Batch failed: ${response.status}`, 'warn');
            continue;
          }

          const data = await response.json();
          const items = data.items || [];

          items.forEach(item => {
            strategyNames[item.strategy_id] = item.name;
          });

        } catch (err) {
          log(`Batch error: ${err.message}`, 'warn');
        }
      }

      log(`Loaded ${Object.keys(strategyNames).length} strategy names`, 'success');
    }

    // Fetch signals from API
    async function fetchSignals() {
      const symbol = document.getElementById('symbol').value.trim().toUpperCase();
      const exchangeId = document.getElementById('exchangeId').value;
      const timeframe = document.getElementById('timeframe').value;
      const countback = document.getElementById('countback').value;

      if (!symbol) {
        log('Please enter a symbol', 'warn');
        return;
      }

      showLoading(true);
      log(`Fetching signals for ${symbol}...`, 'info');

      try {
        const url = `${API_BASE}/me/signals/all?symbol=${symbol}&exchange_id=${exchangeId}&timeframe_min=${timeframe}&countback=${countback}&payload=1&limit=5000`;
        const response = await fetch(url, {
          headers: {
            'Accept': 'application/json',
            'X-API-Key': API_KEY,
            'Authorization': `Bearer ${ACCESS_TOKEN}`
          }
        });

        if (!response.ok) {
          throw new Error(`API returned ${response.status}`);
        }

        const data = await response.json();
        allSignals = Array.isArray(data) ? data : (data.items || data.signals || []);

        log(`Fetched ${allSignals.length} signals`, 'success');

        // Extract unique strategy IDs and fetch their names
        const uniqueStrategyIds = [...new Set(allSignals.map(s => s.strategy_id))];
        log(`Found ${uniqueStrategyIds.length} unique strategies`, 'info');
        await fetchStrategyNames(uniqueStrategyIds);

        renderSignalList();
        updateSignalCount();

        // Update chart symbol
        const currentSymbol = tvWidget.activeChart().symbol();
        if (!currentSymbol.includes(symbol)) {
          tvWidget.activeChart().setSymbol(symbol);
        }

      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      }

      showLoading(false);
    }

    // Render signal list (sorted by strategy_id)
    function renderSignalList() {
      const list = document.getElementById('signalList');

      if (allSignals.length === 0) {
        list.innerHTML = '<p style="color: #787b86; font-size: 12px; text-align: center; padding: 20px;">No signals found</p>';
        return;
      }

      // Sort signals by strategy_id for easier browsing
      const sortedSignals = [...allSignals].sort((a, b) => a.strategy_id - b.strategy_id);

      list.innerHTML = sortedSignals.map((signal) => {
        const originalIndex = allSignals.findIndex(s => s.signal_id === signal.signal_id);
        return `
        <div class="signal-item ${signal.signal_type === 'B' ? 'buy' : 'sell'} ${signal.signal_id === activeSignalId ? 'active' : ''}"
             onclick="drawSignal(${originalIndex})"
             data-id="${signal.signal_id}">
          <div class="signal-row">
            <span class="signal-symbol">${signal.symbol}</span>
            <span class="signal-type ${signal.signal_type === 'B' ? 'buy' : 'sell'}">
              ${signal.signal_type === 'B' ? 'BUY' : 'SELL'}
            </span>
          </div>
          <div class="signal-row">
            <span class="signal-info">${formatTime(signal.candle_close_unix)}</span>
            <span class="strategy-badge">#${signal.strategy_id}</span>
          </div>
          <div class="signal-row">
            <span class="signal-info" style="font-size: 10px; color: #a0a0a0;">${getStrategyName(signal.strategy_id)}</span>
          </div>
          <div class="signal-row">
            <span class="signal-info">Price: <strong>${parseFloat(signal.close_price).toFixed(2)}</strong></span>
            <span class="signal-info">TF: ${signal.timeframe_min}m</span>
          </div>
        </div>
      `;
      }).join('');
    }

    // Update signal count
    function updateSignalCount() {
      document.getElementById('signalCount').textContent = allSignals.length;
    }

    // Draw a single signal
    function drawSignal(index) {
      const signal = allSignals[index];
      if (!signal) return;

      // Update active state
      activeSignalId = signal.signal_id;
      document.querySelectorAll('.signal-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === signal.signal_id);
      });

      // Clear existing shapes
      if (shapesManager) {
        shapesManager.clear();
      }

      log(`Drawing signal: ${signal.signal_id.substring(0, 8)}... (${getStrategyName(signal.strategy_id)})`, 'info');

      // Draw the signal
      if (shapesManager && shapesManager.isReady()) {
        const drawnIds = shapesManager.draw([signal]);
        log(`Drew ${drawnIds.length} shape(s)`, 'success');

        // Navigate to signal time
        navigateToSignal(signal);
      }
    }

    // Navigate chart to signal time
    function navigateToSignal(signal) {
      let minTime = Infinity;
      let maxTime = -Infinity;

      const payload = signal.payload;

      // Find time range from points
      for (let i = 1; i <= 10; i++) {
        const timeKey = `p${i}t`;
        if (payload && payload[timeKey]) {
          const time = payload[timeKey] * 1000;
          minTime = Math.min(minTime, time);
          maxTime = Math.max(maxTime, time);
        }
      }

      // Also check entryPoint
      if (payload && payload.entryPoint) {
        const entryTime = payload.entryPoint * 1000;
        minTime = Math.min(minTime, entryTime);
        maxTime = Math.max(maxTime, entryTime);
      }

      // Fallback to candle_close_unix
      if (minTime === Infinity) {
        minTime = signal.candle_close_unix * 1000;
        maxTime = signal.candle_close_unix * 1000;
      }

      // Navigate with padding
      const range = maxTime - minTime;
      const padding = Math.max(range * 0.5, 7200000); // At least 2 hours
      const fromTime = Math.floor((minTime - padding) / 1000);
      const toTime = Math.floor((maxTime + padding) / 1000);

      tvWidget.activeChart().setVisibleRange({
        from: fromTime,
        to: toTime
      }).catch(err => {
        log(`Navigation failed: ${err.message}`, 'warn');
      });
    }

    // Clear all shapes
    function clearShapes() {
      if (shapesManager) {
        shapesManager.clear();
        activeSignalId = null;
        document.querySelectorAll('.signal-item').forEach(el => {
          el.classList.remove('active');
        });
        log('Cleared all shapes', 'info');
      }
    }

    // Change chart timeframe
    function changeTimeframe(timeframeMin) {
      if (!tvWidget) return;

      // Map timeframe minutes to TradingView resolution
      const resolutionMap = {
        '5': '5',
        '15': '15',
        '30': '30',
        '60': '60',
        '240': '240',
        '1440': '1D'
      };

      const resolution = resolutionMap[timeframeMin] || '15';
      log(`Changing timeframe to ${timeframeMin}m`, 'info');

      tvWidget.activeChart().setResolution(resolution, () => {
        log(`Timeframe changed to ${timeframeMin}m`, 'success');
      });
    }

    // Datafeed for TradingView
    const datafeed = {
      onReady: (callback) => {
        setTimeout(() => callback({
          supported_resolutions: ['1', '5', '15', '30', '60', '240', '1D', '1W'],
          supports_time: true,
          supports_marks: false,
          supports_timescale_marks: false
        }), 0);
      },

      searchSymbols: (userInput, exchange, symbolType, onResult) => {
        onResult([]);
      },

      resolveSymbol: (symbolName, onResolve, onError) => {
        setTimeout(() => {
          onResolve({
            name: symbolName,
            ticker: symbolName,
            description: symbolName,
            type: 'crypto',
            session: '24x7',
            timezone: 'Etc/UTC',
            minmov: 1,
            pricescale: 100,
            has_intraday: true,
            has_daily: true,
            has_weekly_and_monthly: true,
            supported_resolutions: ['1', '5', '15', '30', '60', '240', '1D', '1W'],
            volume_precision: 8,
            data_status: 'streaming',
          });
        }, 0);
      },

      getBars: async (symbolInfo, resolution, periodParams, onResult, onError) => {
        try {
          const { from, to } = periodParams;
          const exchangeId = parseInt(document.getElementById('exchangeId').value);

          const intervalMap = {
            '1': '1m', '5': '5m', '15': '15m', '30': '30m',
            '60': '1h', '240': '4h', '1D': '1d', '1W': '1w'
          };
          const interval = intervalMap[resolution] || '1h';

          const baseUrl = getBinanceApiUrl(exchangeId);
          const url = `${baseUrl}?symbol=${symbolInfo.name}&interval=${interval}&startTime=${from * 1000}&endTime=${to * 1000}&limit=1000`;

          const response = await fetch(url);
          const data = await response.json();

          if (!Array.isArray(data) || data.length === 0) {
            onResult([], { noData: true });
            return;
          }

          const bars = data.map(k => ({
            time: k[0],
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4]),
            volume: parseFloat(k[5])
          }));

          onResult(bars, { noData: false });
        } catch (err) {
          console.error('getBars error:', err);
          onError(err.message);
        }
      },

      subscribeBars: () => {},
      unsubscribeBars: () => {}
    };

    // Initialize
    function initChart() {
      log('Initializing TradingView...', 'info');

      tvWidget = new TradingView.widget({
        container: 'chartContainer',
        symbol: 'BTCUSDT',
        interval: '5',
        datafeed: datafeed,
        library_path: '../vendor/tradingview/charting_library/',
        locale: 'en',
        timezone: 'Etc/UTC',
        theme: 'Dark',
        autosize: true,
        disabled_features: [
          'use_localstorage_for_settings',
          'header_symbol_search',
          'header_compare'
        ],
        overrides: {
          'mainSeriesProperties.candleStyle.upColor': '#26a69a',
          'mainSeriesProperties.candleStyle.downColor': '#ef5350',
          'mainSeriesProperties.candleStyle.borderUpColor': '#26a69a',
          'mainSeriesProperties.candleStyle.borderDownColor': '#ef5350',
          'mainSeriesProperties.candleStyle.wickUpColor': '#26a69a',
          'mainSeriesProperties.candleStyle.wickDownColor': '#ef5350'
        }
      });

      tvWidget.onChartReady(() => {
        log('Chart ready', 'success');

        shapesManager = new NXCChartShapes.default({
          theme: 'dark',
          showEntryMarker: true
        });

        shapesManager.attach(tvWidget).then(() => {
          log('NXC Chart Shapes ready', 'success');
        });
      });
    }

    document.addEventListener('DOMContentLoaded', initChart);
  </script>
</body>
</html>
