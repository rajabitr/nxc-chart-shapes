<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXC Chart Shapes - Sample App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #131722;
      color: #d1d4dc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1e222d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid #2a2e39;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-group label {
      font-size: 13px;
      color: #787b86;
    }

    .input-group input {
      padding: 8px 12px;
      border: 1px solid #363a45;
      border-radius: 4px;
      background: #131722;
      color: #d1d4dc;
      font-size: 13px;
      min-width: 320px;
    }

    .input-group input:focus {
      outline: none;
      border-color: #2962ff;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #2962ff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1e53e4;
    }

    .btn-secondary {
      background: #363a45;
      color: #d1d4dc;
    }

    .btn-secondary:hover {
      background: #434651;
    }

    .btn-success {
      background: #4caf50;
      color: #fff;
    }

    .btn-success:hover {
      background: #43a047;
    }

    .btn-danger {
      background: #f44336;
      color: #fff;
    }

    .btn-danger:hover {
      background: #d32f2f;
    }

    .main {
      flex: 1;
      display: flex;
    }

    .chart-container {
      flex: 1;
      min-height: 500px;
    }

    .sidebar {
      width: 320px;
      background: #1e222d;
      border-left: 1px solid #2a2e39;
      padding: 16px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .signal-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .signal-item {
      background: #131722;
      border: 1px solid #363a45;
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
    }

    .signal-item.buy {
      border-left: 3px solid #4caf50;
    }

    .signal-item.sell {
      border-left: 3px solid #f44336;
    }

    .signal-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .signal-symbol {
      font-weight: 600;
      color: #fff;
    }

    .signal-type {
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 600;
      font-size: 11px;
    }

    .signal-type.buy {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }

    .signal-type.sell {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }

    .signal-details {
      color: #787b86;
      line-height: 1.5;
    }

    .signal-details strong {
      color: #d1d4dc;
    }

    .log-panel {
      background: #0d0f14;
      border-top: 1px solid #2a2e39;
      max-height: 150px;
      overflow-y: auto;
      padding: 12px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
    }

    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #1e222d;
    }

    .log-entry.info {
      color: #2196f3;
    }

    .log-entry.success {
      color: #4caf50;
    }

    .log-entry.error {
      color: #f44336;
    }

    .log-entry.warn {
      color: #ff9800;
    }

    .loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #363a45;
      border-top-color: #2962ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading hidden" id="loading">
    <div class="spinner"></div>
  </div>

  <header class="header">
    <h1>NXC Chart Shapes</h1>
    <div class="controls">
      <div class="input-group">
        <label>Signal IDs:</label>
        <input type="text" id="signalIds" placeholder="Enter signal IDs (comma separated)" value="7e53cc19-f0dd-530f-96ae-51c941544e14">
      </div>
      <button class="btn-primary" onclick="fetchAndDraw()">Fetch & Draw</button>
      <button class="btn-success" onclick="loadDemoSignals()">Demo (Test Data)</button>
      <button class="btn-secondary" onclick="clearShapes()">Clear</button>
    </div>
  </header>

  <main class="main">
    <div class="chart-container" id="chartContainer"></div>
    <aside class="sidebar">
      <h2>Loaded Signals</h2>
      <div class="signal-list" id="signalList">
        <p style="color: #787b86; font-size: 13px;">No signals loaded yet</p>
      </div>
    </aside>
  </main>

  <div class="log-panel" id="logPanel"></div>

  <!-- TradingView Charting Library -->
  <script src="../vendor/tradingview/charting_library/charting_library.standalone.js"></script>

  <!-- NXC Chart Shapes Library (built UMD) -->
  <script src="../dist/umd/nxc-chart-shapes.js"></script>

  <script>
    // Configuration
    const API_BASE = '/api/v1'; // Proxied through nginx to avoid CORS
    const API_KEY = 'MOaNJZ3ZitI1ZSOEf0BATXH1Q0sxP5lnbReA_LZRFbE';

    // NOTE: No need to define STRATEGIES anymore!
    // The library has built-in strategy registry for all strategy_ids.
    // It also auto-detects shape type based on point count if strategy_id is unknown.

    // Demo signals for testing without API (real data from API)
    const DEMO_SIGNALS = [
      // Parallel Channel (3 points) - Real signal from API
      {
        signal_id: '325d135b-e7cc-505c-a6f8-1b872f62552b',
        exchange_id: 1,
        symbol: 'BTCUSDT',
        timeframe_min: 15,
        strategy_id: 342,
        signal_type: 'B',
        pivot_type: 4,
        zone_range: null,
        candle_close_unix: 1769470199,
        close_price: '88413.40000000',
        payload: {
          p1p: '88199',
          p1t: 1769463899.999,
          p2p: '88239',
          p2t: 1769467499.999,
          p3p: '87953.9',
          p3t: 1769466599.999,
          entryPoint: 1769470199.999
        },
        created_at: '2026-01-26T23:46:27.214877Z'
      },
      // Trend Line (2 points) - Real signal from API
      {
        signal_id: '7e53cc19-f0dd-530f-96ae-51c941544e14',
        exchange_id: 1,
        symbol: 'BTCUSDT',
        timeframe_min: 5,
        strategy_id: 315,
        signal_type: 'S',
        pivot_type: 3,
        zone_range: null,
        candle_close_unix: 1769505299,
        close_price: '87969.70000000',
        payload: {
          p1p: '88013.5',
          p1t: 1769468699.999,
          p2p: '87976.5',
          p2t: 1769505299.999,
          entryPoint: 1769505299.999
        },
        created_at: '2026-01-27T09:21:29.502959Z'
      }
    ];

    // Global instances
    let tvWidget = null;
    let shapesManager = null;
    let loadedSignals = [];
    let currentExchangeId = 1; // 1 = Binance Futures, 2 = Binance Spot

    // Get Binance API URL based on exchange type
    function getBinanceApiUrl(exchangeId) {
      // exchange_id: 1 = Futures, 2 = Spot
      return exchangeId === 2
        ? 'https://api.binance.com/api/v3/klines'
        : 'https://fapi.binance.com/fapi/v1/klines';
    }

    // Logging utility
    function log(message, type = 'info') {
      const logPanel = document.getElementById('logPanel');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
      console.log(`[${type}] ${message}`);
    }

    // Show/hide loading
    function showLoading(show) {
      document.getElementById('loading').classList.toggle('hidden', !show);
    }

    // Draw shapes and navigate chart to their time range
    function drawAndNavigate(signals) {
      const drawnIds = shapesManager.draw(signals);
      log(`Drew ${drawnIds.length} shape(s) on chart`, 'success');

      // Find the time range of all signals
      let minTime = Infinity;
      let maxTime = -Infinity;

      signals.forEach(signal => {
        const payload = signal.payload;
        // Check all point times
        for (let i = 1; i <= 10; i++) {
          const timeKey = `p${i}t`;
          if (payload[timeKey]) {
            const time = payload[timeKey] * 1000; // Convert to milliseconds
            minTime = Math.min(minTime, time);
            maxTime = Math.max(maxTime, time);
          }
        }
        // Also check entryPoint
        if (payload.entryPoint) {
          const entryTime = payload.entryPoint * 1000;
          minTime = Math.min(minTime, entryTime);
          maxTime = Math.max(maxTime, entryTime);
        }
      });

      // Navigate to the time range if we found valid times
      if (minTime !== Infinity && maxTime !== -Infinity) {
        // Add some padding (10% on each side)
        const range = maxTime - minTime;
        const padding = Math.max(range * 0.2, 3600000); // At least 1 hour padding
        const fromTime = Math.floor((minTime - padding) / 1000);
        const toTime = Math.floor((maxTime + padding) / 1000);

        log(`Navigating to time range: ${new Date(minTime).toLocaleString()} - ${new Date(maxTime).toLocaleString()}`, 'info');

        // Use setVisibleRange to navigate
        tvWidget.activeChart().setVisibleRange({
          from: fromTime,
          to: toTime
        }).then(() => {
          log('Chart navigated to shape time range', 'success');
        }).catch(err => {
          log(`Failed to navigate: ${err.message}`, 'warn');
        });
      }

      // Log strategy IDs used
      const strategyIds = [...new Set(signals.map(s => s.strategy_id))];
      log(`Strategy IDs used: ${strategyIds.join(', ')}`, 'info');
    }

    // Fetch signal from API
    async function fetchSignal(signalId) {
      const response = await fetch(`${API_BASE}/signals/${signalId}`, {
        headers: {
          'Accept': 'application/json',
          'X-API-Key': API_KEY
        }
      });

      if (!response.ok) {
        throw new Error(`API returned ${response.status}`);
      }

      return response.json();
    }

    // Render signal list
    function renderSignalList() {
      const list = document.getElementById('signalList');

      if (loadedSignals.length === 0) {
        list.innerHTML = '<p style="color: #787b86; font-size: 13px;">No signals loaded yet</p>';
        return;
      }

      list.innerHTML = loadedSignals.map(signal => `
        <div class="signal-item ${signal.signal_type === 'B' ? 'buy' : 'sell'}">
          <div class="signal-header">
            <span class="signal-symbol">${signal.symbol}</span>
            <span class="signal-type ${signal.signal_type === 'B' ? 'buy' : 'sell'}">
              ${signal.signal_type === 'B' ? 'BUY' : 'SELL'}
            </span>
          </div>
          <div class="signal-details">
            <div><strong>ID:</strong> ${signal.signal_id.substring(0, 8)}...</div>
            <div><strong>Strategy ID:</strong> ${signal.strategy_id}</div>
            <div><strong>Timeframe:</strong> ${signal.timeframe_min}m</div>
            <div><strong>Price:</strong> ${parseFloat(signal.close_price).toFixed(2)}</div>
            <div><strong>Time:</strong> ${new Date(signal.candle_close_unix * 1000).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }

    // Fetch and draw signals
    async function fetchAndDraw() {
      const input = document.getElementById('signalIds').value.trim();
      if (!input) {
        log('Please enter at least one signal ID', 'warn');
        return;
      }

      const ids = input.split(',').map(id => id.trim()).filter(Boolean);
      log(`Fetching ${ids.length} signal(s)...`, 'info');
      showLoading(true);

      try {
        // Fetch all signals
        const signals = [];
        for (const id of ids) {
          try {
            const signal = await fetchSignal(id);
            signals.push(signal);
            log(`Fetched signal: ${signal.symbol} (${signal.signal_type})`, 'success');
          } catch (err) {
            log(`Failed to fetch ${id}: ${err.message}`, 'error');
          }
        }

        if (signals.length === 0) {
          log('No valid signals fetched', 'warn');
          showLoading(false);
          return;
        }

        loadedSignals = signals;
        renderSignalList();

        // Clear existing shapes
        if (shapesManager) {
          shapesManager.clear();
        }

        // Draw signals
        if (shapesManager && shapesManager.isReady()) {
          const firstSignal = signals[0];

          // Update chart symbol if needed
          const currentSymbol = tvWidget.activeChart().symbol();
          if (!currentSymbol.includes(firstSignal.symbol)) {
            tvWidget.activeChart().setSymbol(firstSignal.symbol, () => {
              drawAndNavigate(signals);
            });
          } else {
            drawAndNavigate(signals);
          }
        } else {
          log('Shapes manager not ready', 'warn');
        }

      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      }

      showLoading(false);
    }

    // Clear all shapes
    function clearShapes() {
      if (shapesManager) {
        shapesManager.clear();
        loadedSignals = [];
        renderSignalList();
        log('Cleared all shapes', 'info');
      }
    }

    // Load demo signals (no API needed)
    function loadDemoSignals() {
      if (!shapesManager || !shapesManager.isReady()) {
        log('Shapes manager not ready', 'warn');
        return;
      }

      log('Loading demo signals...', 'info');

      // Clear existing
      shapesManager.clear();

      // Use demo signals
      loadedSignals = DEMO_SIGNALS;
      renderSignalList();

      // Get symbol, timeframe, and exchange from first signal
      const firstSignal = DEMO_SIGNALS[0];
      const targetSymbol = firstSignal.symbol;

      // Set exchange type (1 = Futures, 2 = Spot)
      currentExchangeId = firstSignal.exchange_id;
      log(`Exchange: ${currentExchangeId === 2 ? 'Binance Spot' : 'Binance Futures'}`, 'info');

      // Update chart symbol if different
      const currentSymbol = tvWidget.activeChart().symbol();
      if (!currentSymbol.includes(targetSymbol)) {
        log(`Changing symbol to ${targetSymbol}`, 'info');
        tvWidget.activeChart().setSymbol(targetSymbol, () => {
          drawAndNavigate(DEMO_SIGNALS);
        });
      } else {
        drawAndNavigate(DEMO_SIGNALS);
      }
    }

    // Simple datafeed for TradingView
    const datafeed = {
      onReady: (callback) => {
        setTimeout(() => callback({
          supported_resolutions: ['1', '5', '15', '30', '60', '240', '1D', '1W'],
          supports_time: true,
          supports_marks: false,
          supports_timescale_marks: false
        }), 0);
      },

      searchSymbols: (userInput, exchange, symbolType, onResult) => {
        onResult([]);
      },

      resolveSymbol: (symbolName, onResolve, onError) => {
        setTimeout(() => {
          onResolve({
            name: symbolName,
            ticker: symbolName,
            description: symbolName,
            type: 'crypto',
            session: '24x7',
            timezone: 'Etc/UTC',
            minmov: 1,
            pricescale: 100,
            has_intraday: true,
            has_daily: true,
            has_weekly_and_monthly: true,
            supported_resolutions: ['1', '5', '15', '30', '60', '240', '1D', '1W'],
            volume_precision: 8,
            data_status: 'streaming',
          });
        }, 0);
      },

      getBars: async (symbolInfo, resolution, periodParams, onResult, onError) => {
        try {
          const { from, to, firstDataRequest } = periodParams;

          // Map resolution to Binance interval
          const intervalMap = {
            '1': '1m', '5': '5m', '15': '15m', '30': '30m',
            '60': '1h', '240': '4h', '1D': '1d', '1W': '1w'
          };
          const interval = intervalMap[resolution] || '1h';

          // Use correct Binance API (Futures or Spot) based on exchange_id
          const baseUrl = getBinanceApiUrl(currentExchangeId);
          const url = `${baseUrl}?symbol=${symbolInfo.name}&interval=${interval}&startTime=${from * 1000}&endTime=${to * 1000}&limit=1000`;

          log(`Fetching from ${currentExchangeId === 2 ? 'Spot' : 'Futures'}: ${symbolInfo.name}`, 'info');

          const response = await fetch(url);
          const data = await response.json();

          if (!Array.isArray(data) || data.length === 0) {
            onResult([], { noData: true });
            return;
          }

          const bars = data.map(k => ({
            time: k[0],
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4]),
            volume: parseFloat(k[5])
          }));

          onResult(bars, { noData: false });
        } catch (err) {
          console.error('getBars error:', err);
          onError(err.message);
        }
      },

      subscribeBars: (symbolInfo, resolution, onTick, listenerGuid) => {
        // Real-time subscription (simplified - just polling)
      },

      unsubscribeBars: (listenerGuid) => {
        // Unsubscribe
      }
    };

    // Initialize chart and shapes
    function initChart() {
      log('Initializing TradingView widget...', 'info');

      tvWidget = new TradingView.widget({
        container: 'chartContainer',
        symbol: 'BTCUSDT',
        interval: '15',
        datafeed: datafeed,
        library_path: '../vendor/tradingview/charting_library/',
        locale: 'en',
        timezone: 'Etc/UTC',
        theme: 'Dark',
        autosize: true,
        disabled_features: [
          'use_localstorage_for_settings',
          'header_symbol_search',
          'header_compare'
        ],
        enabled_features: [
          'study_templates'
        ],
        overrides: {
          'mainSeriesProperties.candleStyle.upColor': '#26a69a',
          'mainSeriesProperties.candleStyle.downColor': '#ef5350',
          'mainSeriesProperties.candleStyle.borderUpColor': '#26a69a',
          'mainSeriesProperties.candleStyle.borderDownColor': '#ef5350',
          'mainSeriesProperties.candleStyle.wickUpColor': '#26a69a',
          'mainSeriesProperties.candleStyle.wickDownColor': '#ef5350'
        }
      });

      tvWidget.onChartReady(() => {
        log('TradingView chart ready', 'success');

        // Initialize NXC Chart Shapes
        // NOTE: No strategies needed - library has built-in registry!
        shapesManager = new NXCChartShapes.default({
          theme: 'dark',
          showEntryMarker: true
        });

        shapesManager.attach(tvWidget).then(() => {
          log('NXC Chart Shapes attached', 'success');
        });
      });
    }

    // Start when DOM is ready
    document.addEventListener('DOMContentLoaded', initChart);
  </script>
</body>
</html>
